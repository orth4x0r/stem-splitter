[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/orth4x0r/stem-splitter"

[workspace.dependencies]
stem-audio = { path = "crates/stem-audio" }
stem-fetch = { path = "crates/stem-fetch" }
stem-models = { path = "crates/stem-models" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"  # full debuginfo made target/ ~20 GB

[profile.dev.package."*"]
opt-level = 3  # DSP and inference are unusable unoptimized

[profile.release]
lto = "thin"
strip = true  # keeps the .exe under ~30 MB
