[package]
name = "stem-app"
description = "Stem Splitter desktop app (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stem-splitter"
path = "src/main.rs"

[dependencies]
stem-audio.workspace = true
stem-fetch.workspace = true
stem-models.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = "0.37"
rodio = "0.23"
rfd = "0.18"
directories = "6"
crossbeam-channel = "0.5"
# Stem cache keys (input file hashes). Same version as stem-models.
sha2 = "0.11"
# Screenshot mode (STEM_SHOT) saves PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# Native drag-out of stems/samples (OLE drag with a shell data object). Same version as stem-models.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
raw-window-handle = "0.6"
