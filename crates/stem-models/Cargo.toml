[package]
name = "stem-models"
description = "AI source separation models on ONNX Runtime (DirectML on Windows, CPU anywhere)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stem-audio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# load-dynamic: onnxruntime.dll is loaded at runtime (the app downloads the DirectML build),
# so building never needs to fetch native binaries.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "directml", "ndarray", "std", "api-22"] }
ndarray = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
